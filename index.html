<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Clave 5</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="BB745DFA-5EB6-4A0E-A929-5153A3782856.png" alt="La Clave 5" style="height:50px;">
        <div class="logo-text">La Clave 5</div>
    </div>

    <div class="cart">🛒</div>
</header>

<main>
    <section class="products">

        <div class="product">
            <img src="bc9aa844-7247-4a3b-bcaf-a3d5926c47a5.jpeg" alt="Paquete $500 x $2000">
            <h3>$500 → $2,000 en billetes didácticos</h3>
            <p class="price">$500 MXN</p>
            <button>Agregar al carrito</button>
        </div>

        <div class="product">
            <img src="bc9aa844-7247-4a3b-bcaf-a3d5926c47a5.jpeg" alt="Paquete $1000 x $4000">
            <h3>$1,000 → $4,000 en billetes didácticos</h3>
            <p class="price">$1,000 MXN</p>
            <button>Agregar al carrito</button>
        </div>

        <div class="product">
            <img src="bc9aa844-7247-4a3b-bcaf-a3d5926c47a5.jpeg" alt="Paquete $1500 x $6500">
            <h3>$1,500 → $6,500 en billetes didácticos</h3>
            <p class="price">$1,500 MXN</p>
            <button>Agregar al carrito</button>
        </div>

        <div class="product">
            <img src="bc9aa844-7247-4a3b-bcaf-a3d5926c47a5.jpeg" alt="Paquete $2500 x $9000">
            <h3>$2,500 → $9,000 en billetes didácticos</h3>
            <p class="price">$2,500 MXN</p>
            <button>Agregar al carrito</button>
        </div>

        <div class="product">
            <img src="bc9aa844-7247-4a3b-bcaf-a3d5926c47a5.jpeg" alt="Paquete $4000 x $18000">
            <h3>$4,000 → $18,000 en billetes didácticos</h3>
            <p class="price">$4,000 MXN</p>
            <button>Agregar al carrito</button>
        </div>

    </section>
</main>

</body>
</html>
