<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Clave V</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">V</div>
        <div class="logo-text">La Clave V</div>
    </div>

    <div class="cart">🛒</div>
</header>

<main>
    <section class="products">

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="Billetes didácticos básicos">
            <h3>Billetes Didácticos Básicos</h3>
            <p class="price">$199 MXN</p>
            <button>Agregar al carrito</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="Billetes didácticos grandes">
            <h3>Billetes Didácticos Grandes</h3>
            <p class="price">$249 MXN</p>
            <button>Agregar al carrito</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="Paquete educativo premium">
            <h3>Paquete Educativo Premium</h3>
            <p class="price">$349 MXN</p>
            <button>Agregar al carrito</button>
        </div>

    </section>
</main>

</body>
</html>
